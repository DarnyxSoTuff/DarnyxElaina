<script>
  (function() {
    const input = document.getElementById('inputCode');
    const output = document.getElementById('outputCode');
    const obfBtn = document.getElementById('obfuscateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const feedback = document.getElementById('copyFeedback');

    function obfuscateLuaLevelWibu(code) {
      if (!code || code.trim() === '') return '-- Rỗng tuếch';
      
      // Chuyển code thành mảng Byte UTF-8
      let utf8Encode = new TextEncoder();
      let bytes = utf8Encode.encode(code);

      // Thuật toán xào nấu số liệu (x3 + 17)
      let nums = [];
      for(let i = 0; i < bytes.length; i++) {
        nums.push((bytes[i] * 3) + 17);
      }

      // Tạo chuỗi số khổng lồ
      let byteString = nums.join(',');

      // Code Lua đầu ra: Giấu nhẹm mọi thứ, chỉ có một cục table toàn số.
      // Cài sẵn bẫy: Nếu file bị sửa đổi sai lệch hoặc bot cố tình chạy ép, nó sẽ quăng trap.
      let finalCode = `-- Elaina X - Made by Darnyx
(function(a,b,c,d,e,f)
  pcall(function()
    local t={${byteString}}
    local s={}
    for i=1,#t do s[i]=b((t[i]-17)/3) end
    local x,y=c(a(s))
    if type(x)=="function" then
      local ok,err=pcall(x)
      if not ok then print(e) end
    else
      print(e)
    end
  end)
end)(table.concat, string.char, loadstring, print, "mày định lấy source mà dễ à🤣")`;

      return finalCode;
    }

    function handleObfuscate() { output.value = obfuscateLuaLevelWibu(input.value); }

    function handleCopy() {
      if (!output.value.trim()) { feedback.textContent='⚠️ Rỗng'; setTimeout(()=>feedback.textContent='',2000); return; }
      navigator.clipboard.writeText(output.value).then(()=>{
        feedback.textContent='✅ Đã sao chép!';
        setTimeout(()=>feedback.textContent='',2500);
      }).catch(()=>{
        output.select(); document.execCommand('copy');
        feedback.textContent='✅ Đã sao chép (cũ)'; setTimeout(()=>feedback.textContent='',2500);
      });
    }

    function handleClear(){ input.value=''; output.value=''; feedback.textContent=''; }

    obfBtn.addEventListener('click', handleObfuscate);
    copyBtn.addEventListener('click', handleCopy);
    clearBtn.addEventListener('click', handleClear);
    window.addEventListener('load', ()=>setTimeout(handleObfuscate, 300));
  })();
</script>
